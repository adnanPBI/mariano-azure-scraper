[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marianos-azure-scraper"
version = "0.5.0"
description = "Permission-gated Mariano's catalog collection and validated Azure publication"
requires-python = ">=3.11"
dependencies = ["playwright==1.56.0", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7", "azure-storage-blob>=12.22,<13", "azure-identity>=1.19,<2", "cryptography>=42,<52", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
marianos-scrape = "marianos_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"